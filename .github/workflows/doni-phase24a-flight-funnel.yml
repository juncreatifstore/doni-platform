name: DONI Phase 24A Flight Funnel

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production URL
        required: true
        default: https://doni-platform.vercel.app
      anchor_text:
        description: Prior inbound message used to identify the test conversation
        required: true
        default: DONI-PHASE21

jobs:
  flight-funnel:
    name: Controlled flight funnel before search
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BASE_URL: ${{ inputs.base_url }}
      ANCHOR_TEXT: ${{ inputs.anchor_text }}
      DONI_ADMIN_USERNAME: ${{ secrets.DONI_ADMIN_USERNAME }}
      DONI_ADMIN_PASSWORD: ${{ secrets.DONI_ADMIN_PASSWORD }}

    steps:
      - name: Validate admin credentials
        run: |
          set -euo pipefail
          test -n "${DONI_ADMIN_USERNAME:-}" || (echo "Missing DONI_ADMIN_USERNAME" && exit 1)
          test -n "${DONI_ADMIN_PASSWORD:-}" || (echo "Missing DONI_ADMIN_PASSWORD" && exit 1)

      - name: Authenticate SUPER_ADMIN
        run: |
          set -euo pipefail
          payload=$(node -e 'process.stdout.write(JSON.stringify({username:process.env.DONI_ADMIN_USERNAME,password:process.env.DONI_ADMIN_PASSWORD}))')
          code=$(curl -sS -c /tmp/doni-cookies.txt -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' --data "$payload" "$BASE_URL/api/auth/login")
          echo "Login HTTP $code"
          test "$code" = "200"
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/login.json","utf8"));if(!x.success||x.role!=="SUPER_ADMIN"){console.error("SUPER_ADMIN required");process.exit(1)}'

      - name: Verify all external execution gates remain OFF
        run: |
          set -euo pipefail
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/settings" -o /tmp/settings.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/settings.json","utf8"));const m=new Map((x.settings||[]).map(s=>[s.key,s]));const keys=["payments.create_enabled","flights.duffel_enabled","flights.duffel_reprice_enabled","flights.google_fallback_enabled","ticketing.write_enabled","payments.refunds_execute_enabled"];let bad=false;for(const k of keys){const v=m.get(k)?.value;console.log(`${k}: ${String(v)}`);if(v===true)bad=true;}if(bad){console.error("Safety gate failure: an external execution provider is enabled");process.exit(1)}'

      - name: Find WhatsApp test conversation
        run: |
          set -euo pipefail
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/live-ops/conversations?limit=200" -o /tmp/conversations.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/conversations.json","utf8"));for(const c of x.conversations||[])if(c.id)console.log(c.id)' > /tmp/ids.txt
          : > /tmp/found_id.txt
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/live-ops/conversations/$id" -o /tmp/detail.json
            if node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/detail.json","utf8"));const a=process.env.ANCHOR_TEXT;const ms=x.conversation?.messages||[];process.exit(ms.some(m=>String(m.direction).toUpperCase()==="INBOUND"&&String(m.text||"").trim()===a.trim())?0:1)'; then
              echo "$id" > /tmp/found_id.txt
              break
            fi
          done < /tmp/ids.txt
          test -s /tmp/found_id.txt || (echo "Could not find the WhatsApp test conversation" && exit 1)
          echo "CONVERSATION_ID=$(cat /tmp/found_id.txt)" >> "$GITHUB_ENV"

      - name: Reset test conversation to language segment
        run: |
          set -euo pipefail
          code=$(curl -sS -b /tmp/doni-cookies.txt -X POST -o /tmp/reset.json -w '%{http_code}' "$BASE_URL/api/live-ops/conversations/$CONVERSATION_ID/reset")
          echo "Reset HTTP $code"
          test "$code" = "200"
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/reset.json","utf8"));if(!x.success||x.conversation?.currentSegment!=="segment_language")process.exit(1);fs.writeFileSync("/tmp/reset_at.txt",x.resetAt)'
          echo "RESET_AT=$(cat /tmp/reset_at.txt)" >> "$GITHUB_ENV"

      - name: Enable WhatsApp bot temporarily
        run: |
          set -euo pipefail
          code=$(curl -sS -b /tmp/doni-cookies.txt -X PUT -H 'content-type: application/json' --data '{"key":"whatsapp.enabled","value":true}' -o /tmp/enable.json -w '%{http_code}' "$BASE_URL/api/settings")
          echo "Enable HTTP $code"
          test "$code" = "200"

      - name: Wait for controlled flight funnel
        run: |
          set -euo pipefail
          echo "Use WhatsApp normally: Bonjour -> Vols -> trip type -> origin -> destination -> departure date."
          echo "STOP as soon as DONI asks how many passengers. Do not send passenger count in Phase 24A."
          found=0
          for attempt in $(seq 1 24); do
            curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/live-ops/conversations/$CONVERSATION_ID" -o /tmp/detail.json

            if node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/detail.json","utf8"));const c=x.conversation||{};const criteria=c.state?.criteria||{};const reset=Date.parse(process.env.RESET_AT||"");const ms=c.messages||[];const askedPassengers=ms.some(m=>m.senderType==="BOT"&&Date.parse(m.createdAt||0)>=reset&&/combien de .*passagers/i.test(String(m.text||"")));const valid=Boolean(criteria.trip_type&&criteria.origin&&criteria.destination&&criteria.depart_date);process.exit(askedPassengers&&valid?0:1)'; then
              echo "Phase 24A verified: DONI reached passenger selection with valid flight criteria."
              found=1
              break
            fi

            if node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/detail.json","utf8"));const ms=x.conversation?.messages||[];const reset=Date.parse(process.env.RESET_AT||"");const m=[...ms].reverse().find(m=>m.senderType==="SYSTEM"&&m.metadata?.event==="whatsapp_dispatch_failed"&&Date.parse(m.createdAt||0)>=reset);if(!m)process.exit(1);console.error("DONI dispatch failure detected:");console.error(JSON.stringify({text:m.text,error:m.metadata?.error,firstError:m.metadata?.firstError,providerMessageId:m.metadata?.providerMessageId},null,2));process.exit(0)'; then
              exit 2
            fi

            if [ $((attempt % 4)) -eq 0 ]; then
              node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/detail.json","utf8"));const c=x.conversation||{};const criteria=c.state?.criteria||{};const ms=(c.messages||[]).slice(-6).map(m=>({direction:m.direction,senderType:m.senderType,text:String(m.text||"").slice(0,100),event:m.metadata?.event,error:m.metadata?.error,firstError:m.metadata?.firstError,createdAt:m.createdAt}));console.log(JSON.stringify({currentSegment:c.currentSegment,criteria,recentMessages:ms},null,2));'
            fi
            sleep 5
          done
          if [ "$found" != "1" ]; then
            echo "Phase 24A timeout before passenger prompt."
            node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/detail.json","utf8"));const c=x.conversation||{};const ms=(c.messages||[]).slice(-10).map(m=>({direction:m.direction,senderType:m.senderType,text:String(m.text||"").slice(0,120),event:m.metadata?.event,error:m.metadata?.error,firstError:m.metadata?.firstError,createdAt:m.createdAt}));console.log(JSON.stringify({currentSegment:c.currentSegment,criteria:c.state?.criteria||{},recentMessages:ms},null,2));'
            exit 1
          fi

      - name: Safety cleanup - force WhatsApp OFF
        if: always()
        run: |
          if [ -f /tmp/doni-cookies.txt ]; then
            curl -sS -b /tmp/doni-cookies.txt -X PUT -H 'content-type: application/json' --data '{"key":"whatsapp.enabled","value":false}' "$BASE_URL/api/settings" -o /tmp/cleanup.json || true
          fi
          echo "Safety cleanup executed: WhatsApp OFF requested."

      - name: Phase 24A complete
        if: success()
        run: |
          echo "Phase 24A passed: the real WhatsApp flight funnel reached passenger selection with valid criteria and no external search/payment execution."
