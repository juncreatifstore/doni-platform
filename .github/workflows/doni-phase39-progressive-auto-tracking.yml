name: DONI Phase 39 Progressive Automatic Tracking

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production URL
        required: true
        default: https://doni-platform.vercel.app

jobs:
  progressive-auto-tracking:
    name: Validate automatic tracking engine with alerts isolated
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: ${{ inputs.base_url }}
      DONI_ADMIN_USERNAME: ${{ secrets.DONI_ADMIN_USERNAME }}
      DONI_ADMIN_PASSWORD: ${{ secrets.DONI_ADMIN_PASSWORD }}

    steps:
      - name: Authenticate SUPER_ADMIN
        run: |
          set -euo pipefail
          payload=$(node -e 'process.stdout.write(JSON.stringify({username:process.env.DONI_ADMIN_USERNAME,password:process.env.DONI_ADMIN_PASSWORD}))')
          code=$(curl -sS -c /tmp/doni-cookies.txt -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' --data "$payload" "$BASE_URL/api/auth/login")
          echo "Login HTTP $code"; test "$code" = "200"
          node -e 'const x=require("/tmp/login.json");if(!x.success||x.role!=="SUPER_ADMIN")process.exit(1)'

      - name: Verify automatic tracking and all send gates start OFF
        run: |
          set -euo pipefail
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/settings" -o /tmp/settings.json
          node -e '
            const x=require("/tmp/settings.json"),m=new Map((x.settings||[]).map(s=>[s.key,s.value]));
            for(const k of ["tracking.enabled","tracking.auto_poll_enabled","tracking.alerts_enabled","tracking.disruption_alerts_enabled","tracking.test_poll_enabled","tracking.test_alert_enabled","whatsapp.enabled","ticketing.write_enabled","ticketing.delivery_enabled","payments.create_enabled"]){console.log(`${k}: ${String(m.get(k))}`);if(m.get(k)===true)process.exit(7)}
          '

      - name: Verify TEST ticket is safely scheduled outside tracking window
        run: |
          set -euo pipefail
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/ticketing/queue" -o /tmp/queue.json
          node -e '
            const fs=require("fs"),x=require("/tmp/queue.json");const rows=(x.issued||[]).filter(t=>t.pnr==="TST32X");rows.sort((a,b)=>new Date(b.issuedAt)-new Date(a.issuedAt));const t=rows[0];if(!t)process.exit(3);fs.writeFileSync("/tmp/ref",t.reference);
          '
          echo "TICKET_REFERENCE=$(cat /tmp/ref)" >> "$GITHUB_ENV"
          ref=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(open("/tmp/ref").read().strip()))')
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/post-booking/reservations?reference=$ref" -o /tmp/res.json
          node -e '
            const x=require("/tmp/res.json"),r=(x.rows||[])[0];if(!r||!Array.isArray(r.tracking)||!r.tracking.length)throw new Error("tracking_missing");
            const future=r.tracking.filter(t=>t.nextCheckAt&&new Date(t.nextCheckAt).getTime()>Date.now());
            console.log(JSON.stringify({reference:r.reference,hoursToDeparture:r.hoursToDeparture,nextChecks:r.tracking.map(t=>({flight:`${t.airlineCode}${t.flightNumber}`,nextCheckAt:t.nextCheckAt}))},null,2));
            if(r.hoursToDeparture>72&&future.length<1)throw new Error("future_tracking_not_deferred");
          '

      - name: Verify automatic engine is disabled with gates OFF
        run: |
          set -euo pipefail
          code=$(curl -sS -b /tmp/doni-cookies.txt -o /tmp/off.json -w '%{http_code}' -H 'content-type: application/json' -X POST "$BASE_URL/api/flight-ops/run-auto-test")
          echo "Auto engine OFF HTTP $code"; cat /tmp/off.json; test "$code" = "200"
          node -e 'const x=require("/tmp/off.json");if(!x.success||x.disabled!==true||!String(x.reason||"").includes("tracking_disabled"))process.exit(1)'

      - name: Enable provider and automatic polling only
        run: |
          set -euo pipefail
          for pair in 'tracking.enabled true' 'tracking.auto_poll_enabled true'; do
            key=$(echo "$pair"|awk '{print $1}'); val=$(echo "$pair"|awk '{print $2}')
            body=$(node -e 'process.stdout.write(JSON.stringify({key:process.argv[1],value:process.argv[2]==="true"}))' "$key" "$val")
            curl -sS -b /tmp/doni-cookies.txt -H 'content-type: application/json' -X PUT --data "$body" "$BASE_URL/api/settings" -o /tmp/set.json
            node -e 'const x=require("/tmp/set.json");if(!x.success)process.exit(1)'
          done

      - name: Run the same automatic Flight Ops engine used by cron
        run: |
          set -euo pipefail
          code=$(curl -sS -b /tmp/doni-cookies.txt -o /tmp/run.json -w '%{http_code}' -H 'content-type: application/json' -X POST "$BASE_URL/api/flight-ops/run-auto-test")
          echo "Auto engine HTTP $code"; cat /tmp/run.json; test "$code" = "200"
          node -e '
            const x=require("/tmp/run.json");if(!x.success||x.disabled!==false)process.exit(1);
            if(Number(x.alerts||0)!==0)throw new Error("alerts_must_remain_zero");
            console.log(JSON.stringify({tracking:x.tracking,polled:x.polled,deferred:x.deferred,providerFailures:x.providerFailures,alerts:x.alerts},null,2));
          '

      - name: Verify notifications are still fully isolated
        run: |
          set -euo pipefail
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/settings" -o /tmp/live.json
          node -e '
            const x=require("/tmp/live.json"),m=new Map((x.settings||[]).map(s=>[s.key,s.value]));
            for(const k of ["tracking.alerts_enabled","tracking.disruption_alerts_enabled","whatsapp.enabled"]){console.log(`${k}: ${String(m.get(k))}`);if(m.get(k)===true)throw new Error(`${k}_must_stay_off`)}
            if(m.get("tracking.enabled")!==true||m.get("tracking.auto_poll_enabled")!==true)throw new Error("auto_poll_gates_not_enabled");
          '

      - name: Cleanup automatic tracking gates
        if: always()
        run: |
          set +e
          if [ -f /tmp/doni-cookies.txt ]; then
            for key in tracking.auto_poll_enabled tracking.enabled tracking.alerts_enabled tracking.disruption_alerts_enabled whatsapp.enabled; do
              body=$(node -e 'process.stdout.write(JSON.stringify({key:process.argv[1],value:false}))' "$key")
              curl -sS -b /tmp/doni-cookies.txt -H 'content-type: application/json' -X PUT --data "$body" "$BASE_URL/api/settings" >/dev/null || true
            done
          fi

      - name: Verify final safety state
        run: |
          set -euo pipefail
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/settings" -o /tmp/final.json
          node -e '
            const x=require("/tmp/final.json"),m=new Map((x.settings||[]).map(s=>[s.key,s.value]));
            for(const k of ["tracking.auto_poll_enabled","tracking.enabled","tracking.alerts_enabled","tracking.disruption_alerts_enabled","whatsapp.enabled"]){console.log(`${k} final: ${String(m.get(k))}`);if(m.get(k)===true)process.exit(1)}
          '

      - name: Phase 39 complete
        run: echo "Phase 39 passed - the production automatic tracking engine was gated separately, only due/in-window flights were eligible for polling, the TEST ticket remained safely deferred until its 72-hour window, no client notifications were enabled, and all tracking/send gates returned OFF."
