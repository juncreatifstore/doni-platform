name: DONI Phase 28 Zelle Manual Payment

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production URL
        required: true
        default: https://doni-platform.vercel.app
      anchor_text:
        description: Prior inbound message used to identify the WhatsApp test conversation
        required: true
        default: DONI-PHASE21

jobs:
  zelle-manual-payment:
    name: Controlled Zelle reference creation before payment approval
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: ${{ inputs.base_url }}
      ANCHOR_TEXT: ${{ inputs.anchor_text }}
      DONI_ADMIN_USERNAME: ${{ secrets.DONI_ADMIN_USERNAME }}
      DONI_ADMIN_PASSWORD: ${{ secrets.DONI_ADMIN_PASSWORD }}

    steps:
      - name: Validate admin credentials
        run: |
          set -euo pipefail
          test -n "${DONI_ADMIN_USERNAME:-}" || (echo "Missing DONI_ADMIN_USERNAME" && exit 1)
          test -n "${DONI_ADMIN_PASSWORD:-}" || (echo "Missing DONI_ADMIN_PASSWORD" && exit 1)

      - name: Authenticate SUPER_ADMIN
        run: |
          set -euo pipefail
          payload=$(node -e 'process.stdout.write(JSON.stringify({username:process.env.DONI_ADMIN_USERNAME,password:process.env.DONI_ADMIN_PASSWORD}))')
          code=$(curl -sS -c /tmp/doni-cookies.txt -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' --data "$payload" "$BASE_URL/api/auth/login")
          echo "Login HTTP $code"
          test "$code" = "200"
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/login.json","utf8"));if(!x.success||x.role!=="SUPER_ADMIN"){console.error("SUPER_ADMIN required");process.exit(1)}'

      - name: Validate credentials and strict safety gates
        run: |
          set -euo pipefail
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/settings" -o /tmp/settings.json
          node -e '
            const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/settings.json","utf8"));const m=new Map((x.settings||[]).map(s=>[s.key,s]));
            const configured=(k)=>{const s=m.get(k);return Boolean(s?.configured)||s?.source==="database"||s?.source==="environment"||(typeof s?.value==="string"&&s.value.trim().length>0&&!/missing/i.test(s.value));};
            if(!configured("flights.duffel_access_token")){console.error("DUFFEL_NOT_CONFIGURED");process.exit(3)}
            if(!(configured("payments.zelle_email")||configured("payments.zelle_phone"))){console.error("ZELLE_NOT_CONFIGURED");process.exit(4)}
            const mustRemainOff=["payments.create_enabled","flights.google_fallback_enabled","ticketing.write_enabled","payments.refunds_execute_enabled"];
            let bad=false;for(const k of mustRemainOff){const v=m.get(k)?.value;console.log(`${k}: ${String(v)}`);if(v===true)bad=true;}
            if(bad){console.error("Safety gate failure: automatic transaction or ticketing capability is enabled");process.exit(1)}
          '

      - name: Find WhatsApp test conversation
        run: |
          set -euo pipefail
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/live-ops/conversations?limit=200" -o /tmp/conversations.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/conversations.json","utf8"));for(const c of x.conversations||[])if(c.id)console.log(c.id)' > /tmp/ids.txt
          : > /tmp/found_id.txt
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/live-ops/conversations/$id" -o /tmp/detail.json
            if node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/detail.json","utf8"));const a=process.env.ANCHOR_TEXT;const ms=x.conversation?.messages||[];process.exit(ms.some(m=>String(m.direction).toUpperCase()==="INBOUND"&&String(m.text||"").trim()===a.trim())?0:1)'; then
              echo "$id" > /tmp/found_id.txt
              break
            fi
          done < /tmp/ids.txt
          test -s /tmp/found_id.txt || (echo "Could not find WhatsApp test conversation" && exit 1)
          echo "CONVERSATION_ID=$(cat /tmp/found_id.txt)" >> "$GITHUB_ENV"

      - name: Reset test conversation
        run: |
          set -euo pipefail
          code=$(curl -sS -b /tmp/doni-cookies.txt -X POST -o /tmp/reset.json -w '%{http_code}' "$BASE_URL/api/live-ops/conversations/$CONVERSATION_ID/reset")
          echo "Reset HTTP $code"
          test "$code" = "200"
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/reset.json","utf8"));if(!x.success||x.conversation?.currentSegment!=="segment_language")process.exit(1);fs.writeFileSync("/tmp/reset_at.txt",x.resetAt)'
          echo "RESET_AT=$(cat /tmp/reset_at.txt)" >> "$GITHUB_ENV"

      - name: Enable controlled WhatsApp Duffel and manual payment window
        run: |
          set -euo pipefail
          for item in 'whatsapp.enabled true' 'flights.duffel_enabled true' 'flights.duffel_reprice_enabled true' 'payments.manual_create_enabled true'; do
            key=$(echo "$item" | awk '{print $1}'); value=$(echo "$item" | awk '{print $2}')
            body=$(node -e 'process.stdout.write(JSON.stringify({key:process.argv[1],value:process.argv[2]==="true"}))' "$key" "$value")
            code=$(curl -sS -b /tmp/doni-cookies.txt -X PUT -H 'content-type: application/json' --data "$body" -o /tmp/setting.json -w '%{http_code}' "$BASE_URL/api/settings")
            echo "$key -> HTTP $code"; test "$code" = "200"
          done

      - name: Wait for controlled Zelle manual payment reference
        run: |
          set -euo pipefail
          echo "Complete the same flow as Phase 27 with synthetic traveler data."
          echo "At payment choice, select Zelle only. Stop immediately when DONI displays the Zelle reference/instructions. Do NOT send a receipt and do NOT mark payment paid."
          found=0
          for attempt in $(seq 1 120); do
            curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/live-ops/conversations/$CONVERSATION_ID" -o /tmp/detail.json

            if node -e '
              const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/detail.json","utf8"));const c=x.conversation||{};const s=c.state||{};
              const exp=Date.parse(s.payment_expires_at||"");
              const ok=c.currentSegment==="segment_payment_confirmation"&&s.payment_manual===true&&s.payment_method==="zelle"&&s.payment_provider==="manual_zelle"&&typeof s.payment_reference==="string"&&s.payment_reference.startsWith("PAY-")&&Number.isFinite(exp)&&exp>Date.now()&&!s.payment_link;
              if(ok)console.log(JSON.stringify({segment:c.currentSegment,paymentManual:true,paymentMethod:s.payment_method,paymentProvider:s.payment_provider,referenceCreated:true,expiresInFuture:true,paymentLinkCreated:false},null,2));
              process.exit(ok?0:1)
            '; then
              echo "Phase 28 verified: Zelle manual reference created with future expiration and no automatic payment link."
              found=1; break
            fi

            if node -e '
              const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/detail.json","utf8"));const s=x.conversation?.state||{};const unsafe=Boolean(s.payment_link)||s.payment_manual===false;if(!unsafe)process.exit(1);console.error("SAFETY FAILURE: automatic payment path detected during Phase 28.");process.exit(0)
            '; then exit 7; fi

            if node -e '
              const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/detail.json","utf8"));const ms=x.conversation?.messages||[];const reset=Date.parse(process.env.RESET_AT||"");const m=[...ms].reverse().find(m=>m.senderType==="SYSTEM"&&m.metadata?.event==="whatsapp_dispatch_failed"&&Date.parse(m.createdAt||0)>=reset);if(!m)process.exit(1);console.error("WhatsApp dispatch failure:",m.metadata?.error||m.metadata?.firstError||m.text);process.exit(0)
            '; then exit 2; fi

            if [ $((attempt % 12)) -eq 0 ]; then
              node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/detail.json","utf8"));const c=x.conversation||{};const s=c.state||{};console.log(JSON.stringify({segment:c.currentSegment,bookingReady:s.booking_ready===true,paymentManual:s.payment_manual===true,paymentReferenceCreated:Boolean(s.payment_reference),paymentLinkCreated:Boolean(s.payment_link)},null,2));'
            fi
            sleep 5
          done
          if [ "$found" != "1" ]; then
            echo "Phase 28 timeout before controlled Zelle reference validation."
            node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/detail.json","utf8"));const c=x.conversation||{};const s=c.state||{};console.log(JSON.stringify({segment:c.currentSegment,bookingReady:s.booking_ready===true,paymentManual:s.payment_manual===true,paymentReferenceCreated:Boolean(s.payment_reference),paymentLinkCreated:Boolean(s.payment_link)},null,2));'
            exit 1
          fi

      - name: Re-check automatic payment and ticketing gates remain OFF
        if: success()
        run: |
          set -euo pipefail
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/settings" -o /tmp/settings-final.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/settings-final.json","utf8"));const m=new Map((x.settings||[]).map(s=>[s.key,s]));for(const k of ["payments.create_enabled","ticketing.write_enabled","payments.refunds_execute_enabled"]){console.log(`${k} final: ${String(m.get(k)?.value)}`);if(m.get(k)?.value===true)process.exit(1)}'

      - name: Safety cleanup - force manual payment Search Repricing and WhatsApp OFF
        if: always()
        run: |
          if [ -f /tmp/doni-cookies.txt ]; then
            for key in payments.manual_create_enabled flights.duffel_enabled flights.duffel_reprice_enabled whatsapp.enabled; do
              body=$(node -e 'process.stdout.write(JSON.stringify({key:process.argv[1],value:false}))' "$key")
              curl -sS -b /tmp/doni-cookies.txt -X PUT -H 'content-type: application/json' --data "$body" "$BASE_URL/api/settings" -o /tmp/cleanup.json || true
            done
          fi
          echo "Safety cleanup executed: Manual payment creation OFF, Duffel Search OFF, Duffel Repricing OFF, WhatsApp OFF requested."

      - name: Phase 28 complete
        if: success()
        run: |
          echo "Phase 28 passed - a controlled Zelle manual payment reference was created with expiration while all automatic payment/ticketing gates remained disabled."
