name: DONI Phase 37 Controlled Flight Alerts

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production URL
        required: true
        default: https://doni-platform.vercel.app

jobs:
  controlled-flight-alert:
    name: Validate disruption rules and send one isolated TEST alert
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: ${{ inputs.base_url }}
      DONI_ADMIN_USERNAME: ${{ secrets.DONI_ADMIN_USERNAME }}
      DONI_ADMIN_PASSWORD: ${{ secrets.DONI_ADMIN_PASSWORD }}

    steps:
      - name: Authenticate SUPER_ADMIN
        run: |
          set -euo pipefail
          payload=$(node -e 'process.stdout.write(JSON.stringify({username:process.env.DONI_ADMIN_USERNAME,password:process.env.DONI_ADMIN_PASSWORD}))')
          code=$(curl -sS -c /tmp/doni-cookies.txt -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' --data "$payload" "$BASE_URL/api/auth/login")
          echo "Login HTTP $code"
          test "$code" = "200"
          node -e 'const x=require("/tmp/login.json");if(!x.success||x.role!=="SUPER_ADMIN")process.exit(1)'

      - name: Verify production alert and write gates start OFF
        run: |
          set -euo pipefail
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/settings" -o /tmp/settings.json
          node -e '
            const x=require("/tmp/settings.json");const m=new Map((x.settings||[]).map(s=>[s.key,s.value]));
            for(const k of ["tracking.alerts_enabled","tracking.disruption_alerts_enabled","tracking.test_alert_enabled","whatsapp.enabled","ticketing.write_enabled","ticketing.delivery_enabled","payments.create_enabled"]){
              console.log(`${k}: ${String(m.get(k))}`);if(m.get(k)===true)process.exit(7);
            }
          '

      - name: Find issued TEST ticket with tracking
        run: |
          set -euo pipefail
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/ticketing/queue" -o /tmp/queue.json
          node -e '
            const fs=require("fs");const x=require("/tmp/queue.json");
            const rows=(x.issued||[]).filter(t=>t.pnr==="TST32X");rows.sort((a,b)=>new Date(b.issuedAt)-new Date(a.issuedAt));const t=rows[0];
            if(!t){console.error("Issued TEST ticket TST32X not found");process.exit(3)}
            fs.writeFileSync("/tmp/ref",t.reference);console.log(t.reference);
          '
          echo "TICKET_REFERENCE=$(cat /tmp/ref)" >> "$GITHUB_ENV"
          ref=$(python3 -c 'import urllib.parse,os;print(urllib.parse.quote(os.environ["TICKET_REFERENCE"]))')
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/post-booking/reservations?reference=$ref" -o /tmp/res.json
          node -e 'const x=require("/tmp/res.json");const r=(x.rows||[])[0];if(!r||!Array.isArray(r.tracking)||r.tracking.length<1)throw new Error("tracking_not_ready")'

      - name: Verify test endpoint is locked by default
        run: |
          set -euo pipefail
          body=$(node -e 'process.stdout.write(JSON.stringify({reference:process.env.TICKET_REFERENCE,scenario:"delay"}))')
          code=$(curl -sS -b /tmp/doni-cookies.txt -o /tmp/locked.json -w '%{http_code}' -H 'content-type: application/json' -X POST --data "$body" "$BASE_URL/api/flight-ops/test-alert")
          echo "Locked test endpoint HTTP $code"
          cat /tmp/locked.json
          test "$code" = "403"
          node -e 'const x=require("/tmp/locked.json");if(x.error!=="tracking_test_alert_disabled")process.exit(1)'

      - name: Enable isolated TEST alert and WhatsApp only
        run: |
          set -euo pipefail
          for pair in 'tracking.test_alert_enabled true' 'whatsapp.enabled true'; do
            key=$(echo "$pair"|awk '{print $1}'); val=$(echo "$pair"|awk '{print $2}')
            body=$(node -e 'process.stdout.write(JSON.stringify({key:process.argv[1],value:process.argv[2]==="true"}))' "$key" "$val")
            curl -sS -b /tmp/doni-cookies.txt -H 'content-type: application/json' -X PUT --data "$body" "$BASE_URL/api/settings" -o /tmp/set.json
            node -e 'const x=require("/tmp/set.json");if(!x.success)process.exit(1)'
          done

      - name: Send one controlled TEST delay alert and validate detection rules
        run: |
          set -euo pipefail
          body=$(node -e 'process.stdout.write(JSON.stringify({reference:process.env.TICKET_REFERENCE,scenario:"delay"}))')
          code=$(curl -sS -b /tmp/doni-cookies.txt -o /tmp/test.json -w '%{http_code}' -H 'content-type: application/json' -X POST --data "$body" "$BASE_URL/api/flight-ops/test-alert")
          echo "Test alert HTTP $code"
          cat /tmp/test.json
          test "$code" = "200"
          node -e '
            const x=require("/tmp/test.json");if(!x.success||x.sent!==true||x.mutatedFlightState!==false)process.exit(1);
            const c=x.classifications||{};
            if(c.scheduled!==null)throw new Error("scheduled_should_not_alert");
            if(c.delay29!==null)throw new Error("delay_29_should_not_alert");
            if(c.delay30!=="delay")throw new Error("delay_30_should_alert");
            if(c.delayed!=="delay")throw new Error("delayed_status_should_alert");
            if(c.cancelled!=="cancelled")throw new Error("cancelled_rule_failed");
            if(c.diverted!=="diverted")throw new Error("diverted_rule_failed");
            console.log(JSON.stringify({flight:x.flight,route:x.route,classifications:c,sent:x.sent,mutatedFlightState:x.mutatedFlightState},null,2));
          '

      - name: Cleanup TEST and WhatsApp gates
        if: always()
        run: |
          set +e
          if [ -f /tmp/doni-cookies.txt ]; then
            for key in tracking.test_alert_enabled whatsapp.enabled tracking.alerts_enabled tracking.disruption_alerts_enabled; do
              body=$(node -e 'process.stdout.write(JSON.stringify({key:process.argv[1],value:false}))' "$key")
              curl -sS -b /tmp/doni-cookies.txt -H 'content-type: application/json' -X PUT --data "$body" "$BASE_URL/api/settings" >/dev/null || true
            done
          fi

      - name: Verify final safety state
        run: |
          set -euo pipefail
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/settings" -o /tmp/final.json
          node -e '
            const x=require("/tmp/final.json");const m=new Map((x.settings||[]).map(s=>[s.key,s.value]));
            for(const k of ["tracking.test_alert_enabled","whatsapp.enabled","tracking.alerts_enabled","tracking.disruption_alerts_enabled"]){console.log(`${k} final: ${String(m.get(k))}`);if(m.get(k)===true)process.exit(1)}
          '

      - name: Phase 37 complete
        run: echo "Phase 37 passed - disruption thresholds and statuses were validated with production classification logic, one isolated TEST WhatsApp alert was sent, no flight state was mutated, and all alert/send gates were returned OFF."
