name: DONI Ops — état des lieux

# Lit l'état réel de la plateforme (interrupteurs, intégrations configurées,
# tests de connexion) et le publie dans le résumé du run. Aucun secret n'est
# affiché : seulement "configuré / non configuré" et le résultat des tests.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL de la plateforme
        default: https://doni-platform.vercel.app
      run_connection_tests:
        description: Tester les connexions (Duffel, Stripe, WhatsApp…)
        type: boolean
        default: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Connexion SUPER_ADMIN
        env:
          DONI_ADMIN_USERNAME: ${{ secrets.DONI_ADMIN_USERNAME }}
          DONI_ADMIN_PASSWORD: ${{ secrets.DONI_ADMIN_PASSWORD }}
        run: |
          payload=$(node -e 'process.stdout.write(JSON.stringify({username:process.env.DONI_ADMIN_USERNAME,password:process.env.DONI_ADMIN_PASSWORD}))')
          code=$(curl -sS -c /tmp/c.txt -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' --data "$payload" "$BASE_URL/api/auth/login")
          echo "login http=$code"
          node -e 'const r=require("/tmp/login.json");console.log(JSON.stringify({success:r.success,mfaRequired:r.mfaRequired,error:r.error}))'
          test "$code" = "200"

      - name: Health
        run: curl -sS "$BASE_URL/api/health" | tee /tmp/health.json; echo

      - name: Réglages (sans secrets)
        run: |
          curl -sS -b /tmp/c.txt "$BASE_URL/api/settings" -o /tmp/settings.json
          node -e '
            const d=require("/tmp/settings.json");
            if(!d.success){console.log("settings error:",d.error);process.exit(1)}
            const rows=d.settings;
            const sw=rows.filter(r=>r.type==="boolean").map(r=>`| ${r.category} | ${r.key} | ${r.value?"**ON**":"off"} |`);
            const sec=rows.filter(r=>r.type==="secret").map(r=>`| ${r.category} | ${r.key} | ${r.configured?"✅ configuré":"— absent"} |`);
            const txt=rows.filter(r=>r.type!=="boolean"&&r.type!=="secret").map(r=>`| ${r.category} | ${r.key} | ${r.configured?"✅":"—"} |`);
            const out=["## Interrupteurs","| Catégorie | Clé | État |","|---|---|---|",...sw,"","## Secrets d’intégration","| Catégorie | Clé | État |","|---|---|---|",...sec,"","## Autres réglages","| Catégorie | Clé | Renseigné |","|---|---|---|",...txt].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,out+"\n");
            console.log(out);
          '

      - name: Tests de connexion
        if: ${{ inputs.run_connection_tests }}
        run: |
          echo "## Tests de connexion" >> "$GITHUB_STEP_SUMMARY"
          echo "| Intégration | Résultat | Message |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for n in whatsapp whatsapp_webhook duffel stripe mercadopago paypal brevo facebook; do
            r=$(curl -sS -b /tmp/c.txt -H 'content-type: application/json' --data "{\"integration\":\"$n\"}" "$BASE_URL/api/settings/test")
            line=$(node -e 'const r=JSON.parse(process.argv[1]);const t=r.result||r;console.log(`| '"$n"' | ${t.ok?"✅":"❌"} | ${(t.message||r.error||"").toString().replace(/\|/g,"/")} |`)' "$r")
            echo "$line" | tee -a "$GITHUB_STEP_SUMMARY"
          done
