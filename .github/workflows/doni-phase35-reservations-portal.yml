name: DONI Phase 35 Mes Reservations Portal

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production URL
        required: true
        default: https://doni-platform.vercel.app

jobs:
  validate-reservations-portal:
    name: Validate Mes reservations UI with resend safety gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: ${{ inputs.base_url }}
      DONI_ADMIN_USERNAME: ${{ secrets.DONI_ADMIN_USERNAME }}
      DONI_ADMIN_PASSWORD: ${{ secrets.DONI_ADMIN_PASSWORD }}

    steps:
      - name: Authenticate SUPER_ADMIN
        run: |
          set -euo pipefail
          payload=$(node -e 'process.stdout.write(JSON.stringify({username:process.env.DONI_ADMIN_USERNAME,password:process.env.DONI_ADMIN_PASSWORD}))')
          code=$(curl -sS -c /tmp/doni-cookies.txt -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' --data "$payload" "$BASE_URL/api/auth/login")
          echo "Login HTTP $code"
          test "$code" = "200"
          node -e 'const x=require("/tmp/login.json");if(!x.success||x.role!=="SUPER_ADMIN")process.exit(1)'

      - name: Verify delivery, WhatsApp and alert gates are OFF
        run: |
          set -euo pipefail
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/settings" -o /tmp/settings.json
          node -e '
            const x=require("/tmp/settings.json");const m=new Map((x.settings||[]).map(s=>[s.key,s.value]));
            for(const k of ["ticketing.write_enabled","ticketing.delivery_enabled","whatsapp.enabled","tracking.alerts_enabled","tracking.disruption_alerts_enabled"]){
              console.log(`${k}: ${String(m.get(k))}`);if(m.get(k)===true)process.exit(7);
            }
          '

      - name: Find issued TEST reservation
        run: |
          set -euo pipefail
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/post-booking/reservations" -o /tmp/reservations.json
          node -e '
            const fs=require("fs");const x=require("/tmp/reservations.json");
            const rows=(x.rows||[]).filter(r=>r.pnr==="TST32X");const r=rows[0];
            if(!r){console.error("TEST reservation TST32X not found");process.exit(3)}
            const pnrs=(r.segments||[]).map(s=>s.pnr||s.bookingReference);
            if(pnrs[0]!=="VQ7K2A"||pnrs[1]!=="JH9M5B")throw new Error(`segment_pnrs_invalid:${pnrs.join(",")}`);
            fs.writeFileSync("/tmp/ref",r.reference);
            console.log(JSON.stringify({reference:r.reference,status:r.status,deliveryStatus:r.deliveryStatus,trackingReady:r.trackingReady,checkinEligible:r.checkinEligible,segmentPnrs:pnrs},null,2));
          '
          echo "TICKET_REFERENCE=$(cat /tmp/ref)" >> "$GITHUB_ENV"

      - name: Validate Mes reservations rendered page
        run: |
          set -euo pipefail
          code=$(curl -sS -b /tmp/doni-cookies.txt -o /tmp/page.html -w '%{http_code}' "$BASE_URL/reservations")
          echo "Reservations page HTTP $code"
          test "$code" = "200"
          grep -q 'Mes réservations' /tmp/page.html
          grep -q "$TICKET_REFERENCE" /tmp/page.html
          grep -q 'VQ7K2A' /tmp/page.html
          grep -q 'JH9M5B' /tmp/page.html
          grep -q 'Voir e-ticket' /tmp/page.html
          grep -q 'Renvoyer e-ticket' /tmp/page.html
          grep -q 'Suivi du vol' /tmp/page.html
          grep -q 'Check-in' /tmp/page.html
          echo "Mes réservations UI rendered with TEST ticket and per-segment PNRs."

      - name: Verify resend cannot bypass delivery safety gate
        run: |
          set -euo pipefail
          body=$(node -e 'process.stdout.write(JSON.stringify({reference:process.env.TICKET_REFERENCE}))')
          code=$(curl -sS -b /tmp/doni-cookies.txt -o /tmp/deliver.json -w '%{http_code}' -H 'content-type: application/json' -X POST --data "$body" "$BASE_URL/api/ticketing/deliver")
          echo "Blocked resend HTTP $code"
          cat /tmp/deliver.json
          test "$code" = "403"
          node -e 'const x=require("/tmp/deliver.json");if(x.error!=="ticketing_delivery_disabled")process.exit(1)'

      - name: Final safety re-check
        run: |
          set -euo pipefail
          curl -sS -b /tmp/doni-cookies.txt "$BASE_URL/api/settings" -o /tmp/final.json
          node -e '
            const x=require("/tmp/final.json");const m=new Map((x.settings||[]).map(s=>[s.key,s.value]));
            for(const k of ["ticketing.write_enabled","ticketing.delivery_enabled","whatsapp.enabled","tracking.alerts_enabled","tracking.disruption_alerts_enabled"]){if(m.get(k)===true)process.exit(1)}
          '

      - name: Phase 35 complete
        run: echo "Phase 35 passed - Mes reservations portal renders issued tickets, separate segment PNRs and post-booking actions, while e-ticket resend remains protected by the delivery safety gate."
